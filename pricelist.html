<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIJAY ONLINE SERVICES - Government & Financial Services</title>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #EC4899 100%);
            --card-bg: #ffffff;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --accent-green: #10B981;
            --accent-indigo: #4F46E5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #F3F4F6;
            color: var(--text-main);
            padding-bottom: 40px;
        }

        /* =========================================
           LOADING SCREEN
        ========================================= */

        #loadingScreen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                #4F46E5 0%,
                #7C3AED 50%,
                #EC4899 100%
            );
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 99999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loadingScreen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-logo {
            width: 85px;
            height: 85px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin-bottom: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: logoPulse 1.5s ease-in-out infinite;
        }

        .loading-title {
            color: white;
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85rem;
            margin-bottom: 22px;
            text-align: center;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .loading-dots {
            margin-top: 18px;
            color: white;
            font-size: 14px;
            letter-spacing: 4px;
            animation: dots 1.4s infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes logoPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        @keyframes dots {
            0%, 20% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.3;
            }
        }

        /* =========================================
           HERO BANNER
        ========================================= */

        .hero {
            background: var(--primary-gradient);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: relative;
        }

        .hero h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .hero p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .hero .badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 12px;
            backdrop-filter: blur(5px);
        }

        /* =========================================
           CONTAINER & GRID
        ========================================= */

        .main-container {
            max-width: 900px;
            margin: -20px auto 0;
            padding: 0 20px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        /* =========================================
           SERVICE CARDS
        ========================================= */

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .price-tag {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-indigo);
            margin-bottom: 16px;
        }

        /* =========================================
           PAY BUTTON
        ========================================= */

        .btn-pay {
            display: block;
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-pay:hover {
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
            transform: translateY(-1px);
        }

        /* =========================================
           BACK TO HOME
        ========================================= */

        .back-home-container {
            text-align: center;
            margin: 30px 0 10px;
        }

        .btn-home {
            display: inline-block;
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45);
        }

        /* =========================================
           FOOTER
        ========================================= */

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .hero {
                padding: 30px 15px;
            }

            .hero h1 {
                font-size: 1.6rem;
            }

            .main-container {
                padding: 0 15px;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }

            .loader-logo {
                width: 75px;
                height: 75px;
                font-size: 36px;
            }

            .loading-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         LOADING SCREEN
    ========================================= -->

    <div id="loadingScreen">

        <div class="loader-logo">
            📄
        </div>

        <div class="loading-title">
            Melvin Sai Infotech
        </div>

        <div class="loading-text">
            Loading services...
        </div>

        <div class="loader"></div>

        <div class="loading-dots">
            • • •
        </div>

    </div>


    <!-- =========================================
         HERO BANNER
    ========================================= -->

    <div class="hero">

        <h1>Melvin Sai Infotech</h1>

        <p>
            Government & Financial Services Portal
        </p>

        <span class="badge">
            Fast • Reliable • Instant Payment
        </span>

    </div>


    <!-- =========================================
         MAIN CONTENT
    ========================================= -->

    <div class="main-container">

        <div class="services-grid" id="servicesGrid">

            <!-- Services rendered dynamically -->

        </div>


        <!-- BACK TO HOME -->

        <div class="back-home-container">

            <a href="index.html" class="btn-home">
                🏠 Back to Home
            </a>

        </div>


        <!-- FOOTER -->

        <div class="footer">

            © Melvin Sai Infotech. All Rights Reserved.
            • Instant NPCI UPI Payment Gateway

        </div>

    </div>


    <script>

        const sheetCsvUrl =
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJIIoaOf1Dzbrenip2CUhUFTyBc6rp2mjcMXHqMtZa2QiuLMD7rXjoFc4Xx2cmzb3V8YaalnjWcD3u/pub?output=csv";


        /* =========================================
           CSV PARSER
        ========================================= */

        function parseCSVLine(line) {

            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {

                const char = line[i];

                if (char === '"' || char === "'") {

                    inQuotes = !inQuotes;

                }

                else if (char === ',' && !inQuotes) {

                    result.push(current.trim());

                    current = '';

                }

                else {

                    current += char;

                }

            }

            result.push(current.trim());

            return result;
        }


        /* =========================================
           FETCH SERVICES
        ========================================= */

        async function fetchServicesFromSheet() {

            try {

                const response =
                    await fetch(sheetCsvUrl);

                const csvData =
                    await response.text();

                const lines =
                    csvData
                    .split(/\r?\n/)
                    .filter(line => line.trim() !== '');

                const services = [];


                // Start from Row 2
                for (let i = 1; i < lines.length; i++) {

                    const columns =
                        parseCSVLine(lines[i]);


                    // Column A
                    const name =
                        columns[0]
                        ? columns[0]
                            .replace(/^["']|["']$/g, '')
                            .trim()
                        : '';


                    // Column O
                    const priceRaw =
                        columns[14]
                        ? columns[14]
                            .replace(/[^0-9.]/g, '')
                            .trim()
                        : '0';


                    if (name) {

                        services.push({

                            icon: "📄",

                            name: name,

                            desc: `${name} Service`,

                            price:
                                priceRaw
                                ? parseFloat(priceRaw).toFixed(2)
                                : "0.00"

                        });

                    }

                }


                if (services.length > 0) {

                    localStorage.setItem(
                        "msi_services",
                        JSON.stringify(services)
                    );

                }

            }

            catch (error) {

                console.error(
                    "Error fetching Google Sheet data:",
                    error
                );

            }


            renderServices();


            /* =========================================
               HIDE LOADING SCREEN
            ========================================= */

            setTimeout(() => {

                const loadingScreen =
                    document.getElementById(
                        "loadingScreen"
                    );

                loadingScreen.classList.add("hide");

            }, 500);

        }


        /* =========================================
           GET SAVED SERVICES
        ========================================= */

        function getServices() {

            const saved =
                localStorage.getItem(
                    "msi_services"
                );

            if (saved) {

                return JSON.parse(saved);

            }

            return [];

        }


        /* =========================================
           RENDER SERVICES
        ========================================= */

        function renderServices() {

            const services =
                getServices();

            const grid =
                document.getElementById(
                    "servicesGrid"
                );

            grid.innerHTML = "";


            if (services.length === 0) {

                grid.innerHTML =
                    "<p style='grid-column:1/-1;text-align:center;color:var(--text-muted);'>No services available.</p>";

                return;

            }


            services.forEach(service => {

                const card =
                    document.createElement("div");

                card.className = "card";


                const displayPrice =
                    parseFloat(
                        service.price || 0
                    ).toFixed(2);


                const payPrice =
                    Math.round(
                        parseFloat(
                            service.price || 0
                        )
                    );


                card.innerHTML = `

                    <div>

                        <div class="card-icon">
                            ${service.icon}
                        </div>

                        <h3>
                            ${service.name}
                        </h3>

                        <p>
                            ${service.desc}
                        </p>

                    </div>

                    <div>

                        <div class="price-tag">
                            ₹${displayPrice}
                        </div>

                        <button
                            class="btn-pay"
                            onclick="payForService(
                                '${service.name}',
                                '${displayPrice}'
                            )"
                        >
                            Pay ₹${payPrice} Now
                        </button>

                    </div>

                `;


                grid.appendChild(card);

            });

        }


        /* =========================================
           PAYMENT
        ========================================= */

        function payForService(
            serviceName,
            price
        ) {

            const orderId =
                "MSI" + Date.now();


            const targetUrl =
                `payment.html?amount=${encodeURIComponent(price)}&service=${encodeURIComponent(serviceName)}&orderId=${encodeURIComponent(orderId)}`;


            window.location.href =
                targetUrl;

        }


        /* =========================================
           START
        ========================================= */

        fetchServicesFromSheet();

    </script>

</body>
</html>
```
