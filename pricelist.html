<body>

    <!-- Header / Hero Banner -->
    <div class="hero">
        <h1>Melvin Sai Infotech</h1>
        <p>Government & Financial Services Portal</p>
        <span class="badge">Fast • Reliable • Instant Payment</span>
    </div>

    <!-- Main Content -->
    <div class="main-container">

        <!-- Services Grid -->
        <div class="services-grid" id="servicesGrid">
            <!-- Services rendered dynamically from Google Sheets -->
        </div>

        <!-- Back to Home Button -->
        <div class="back-home-container">
            <a href="index.html" class="btn-home">
                🏠 Back to Home
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            © Melvin Sai Infotech. All Rights Reserved. • Instant NPCI UPI Payment Gateway
        </div>

    </div>

    <script>

        const sheetCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJIIoaOf1Dzbrenip2CUhUFTyBc6rp2mjcMXHqMtZa2QiuLMD7rXjoFc4Xx2cmzb3V8YaalnjWcD3u/pub?output=csv";

        // Parse CSV text accounting for quotes and commas
        function parseCSVLine(line) {

            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {

                const char = line[i];

                if (char === '"' || char === "'") {
                    inQuotes = !inQuotes;
                }

                else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                }

                else {
                    current += char;
                }
            }

            result.push(current.trim());

            return result;
        }


        // Fetch services from Google Sheet
        async function fetchServicesFromSheet() {

            try {

                const response = await fetch(sheetCsvUrl);
                const csvData = await response.text();

                const lines = csvData
                    .split(/\r?\n/)
                    .filter(line => line.trim() !== '');

                const services = [];

                // Start from row 2
                for (let i = 1; i < lines.length; i++) {

                    const columns = parseCSVLine(lines[i]);

                    // Column A
                    const name = columns[0]
                        ? columns[0]
                            .replace(/^["']|["']$/g, '')
                            .trim()
                        : '';

                    // Column O = Index 14
                    const priceRaw = columns[14]
                        ? columns[14]
                            .replace(/[^0-9.]/g, '')
                            .trim()
                        : '0';

                    if (name) {

                        services.push({
                            icon: "📄",
                            name: name,
                            desc: `${name} Service`,
                            price: priceRaw
                                ? parseFloat(priceRaw).toFixed(2)
                                : "0.00"
                        });

                    }
                }

                if (services.length > 0) {

                    localStorage.setItem(
                        "msi_services",
                        JSON.stringify(services)
                    );

                }

            }

            catch (error) {

                console.error(
                    "Error fetching Google Sheet data:",
                    error
                );

            }

            renderServices();
        }


        // Get saved services
        function getServices() {

            const saved = localStorage.getItem("msi_services");

            if (saved) {
                return JSON.parse(saved);
            }

            return [];
        }


        // Render service cards
        function renderServices() {

            const services = getServices();

            const grid = document.getElementById("servicesGrid");

            grid.innerHTML = "";

            if (services.length === 0) {

                grid.innerHTML =
                    "<p style='grid-column:1/-1;text-align:center;color:var(--text-muted);'>Loading services...</p>";

                return;
            }


            services.forEach(service => {

                const card = document.createElement("div");

                card.className = "card";

                const displayPrice =
                    parseFloat(service.price || 0).toFixed(2);

                const payPrice =
                    Math.round(parseFloat(service.price || 0));


                card.innerHTML = `

                    <div>

                        <div class="card-icon">
                            ${service.icon}
                        </div>

                        <h3>
                            ${service.name}
                        </h3>

                        <p>
                            ${service.desc}
                        </p>

                    </div>

                    <div>

                        <div class="price-tag">
                            ₹${displayPrice}
                        </div>

                        <button
                            class="btn-pay"
                            onclick="payForService('${service.name}', '${displayPrice}')"
                        >
                            Pay ₹${payPrice} Now
                        </button>

                    </div>
                `;

                grid.appendChild(card);

            });
        }


        // Route to payment page
        function payForService(serviceName, price) {

            const orderId = "MSI" + Date.now();

            const targetUrl =
                `payment.html?amount=${encodeURIComponent(price)}&service=${encodeURIComponent(serviceName)}&orderId=${encodeURIComponent(orderId)}`;

            window.location.href = targetUrl;
        }


        // Fetch Google Sheet data on page load
        fetchServicesFromSheet();

    </script>

</body>
</html>
