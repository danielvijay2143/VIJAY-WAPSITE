<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b16" />
  <meta
    name="description"
    content="Tamil Nadu Government Services - Official Service Directory"
  />
  <title>Tamil Nadu Government Services</title>

  <style>
    /* =========================================================
       THEME VARIABLES
       Dark mode is the default.
       Light mode only overrides the variables below.
       ========================================================= */

    :root {
      --bg: #070b16;
      --bg-2: #0c1222;
      --surface: rgba(17, 25, 45, 0.72);
      --surface-solid: #10182b;
      --surface-hover: rgba(25, 36, 63, 0.88);

      --text: #f4f7ff;
      --text-soft: #d5dced;
      --muted: #a7b1c5;

      --primary: #6ea8ff;
      --primary-2: #9b7cff;
      --success: #4fe0b0;
      --warning: #ffc857;
      --danger: #ff6b7a;

      --border: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(255, 255, 255, 0.18);

      --shadow:
        0 25px 70px rgba(0, 0, 0, 0.38),
        0 10px 30px rgba(0, 0, 0, 0.22);

      --shadow-soft:
        0 12px 35px rgba(0, 0, 0, 0.22);

      --glass-blur: blur(18px);

      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 15px;
      --radius-sm: 10px;

      --header-bg: rgba(7, 11, 22, 0.72);
      --input-bg: rgba(255, 255, 255, 0.055);

      --hero-glow-1: rgba(110, 168, 255, 0.18);
      --hero-glow-2: rgba(155, 124, 255, 0.15);
    }

    /* =========================================================
       HIGH VISIBILITY LIGHT MODE
       ========================================================= */

    body.light {
      --bg: #f3f7fc;
      --bg-2: #eaf0f8;

      --surface: rgba(255, 255, 255, 0.96);
      --surface-solid: #ffffff;
      --surface-hover: #f5f8fd;

      --text: #10233f;
      --text-soft: #263c5a;
      --muted: #4d6078;

      --primary: #005fc7;
      --primary-2: #5635b9;
      --success: #007f5f;
      --warning: #9b6500;
      --danger: #c6283d;

      --border: #c9d5e5;
      --border-strong: #aabbd1;

      --shadow:
        0 22px 55px rgba(32, 61, 97, 0.14),
        0 8px 22px rgba(32, 61, 97, 0.10);

      --shadow-soft:
        0 10px 28px rgba(32, 61, 97, 0.12);

      --header-bg: rgba(255, 255, 255, 0.94);
      --input-bg: #ffffff;

      --hero-glow-1: rgba(0, 95, 199, 0.10);
      --hero-glow-2: rgba(86, 53, 185, 0.08);
    }

    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);
      background:
        radial-gradient(
          circle at 10% 10%,
          var(--hero-glow-1),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 15%,
          var(--hero-glow-2),
          transparent 30%
        ),
        linear-gradient(135deg, var(--bg), var(--bg-2));

      overflow-x: hidden;
      transition:
        background 0.35s ease,
        color 0.35s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        );
      background-size: 45px 45px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
      z-index: -3;
    }

    body.light::before {
      opacity: 0.42;
      background-image:
        linear-gradient(
          rgba(16, 35, 63, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(16, 35, 63, 0.035) 1px,
          transparent 1px
        );
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       BACKGROUND EFFECTS
       ========================================================= */

    .ambient {
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.28;
      pointer-events: none;
      z-index: -2;
      animation: floatBlob 12s ease-in-out infinite alternate;
    }

    .ambient.one {
      background: #476cff;
      top: -100px;
      left: -120px;
    }

    .ambient.two {
      background: #8a45ff;
      right: -120px;
      top: 30%;
      animation-delay: -4s;
    }

    .ambient.three {
      background: #00b894;
      bottom: -180px;
      left: 35%;
      animation-delay: -7s;
    }

    body.light .ambient {
      opacity: 0.13;
    }

    @keyframes floatBlob {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(30px, -25px, 0) scale(1.08);
      }
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      width: 100%;

      background: var(--header-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);

      border-bottom: 1px solid var(--border);

      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
    }

    .topbar-inner {
      max-width: 1400px;
      margin: auto;

      min-height: 76px;
      padding: 12px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;

      display: grid;
      place-items: center;

      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          var(--primary),
          var(--primary-2)
        );

      box-shadow:
        0 10px 30px rgba(80, 100, 255, 0.30),
        inset 0 1px 1px rgba(255, 255, 255, 0.30);

      font-size: 25px;

      transform: perspective(600px) rotateX(3deg);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 850;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .icon-btn,
    .admin-btn {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);

      min-height: 42px;

      border-radius: 12px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 0 13px;

      box-shadow: var(--shadow-soft);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .icon-btn {
      width: 42px;
      padding: 0;
      font-size: 18px;
    }

    .admin-btn {
      font-size: 13px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      color: #fff;
      border-color: transparent;
    }

    .icon-btn:hover,
    .admin-btn:hover {
      transform: translateY(-2px);
    }

    /* =========================================================
       MAIN
       ========================================================= */

    main {
      width: min(1400px, calc(100% - 32px));
      margin: auto;
      padding: 45px 0 60px;
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      position: relative;
      overflow: hidden;

      padding: 54px 34px;

      border: 1px solid var(--border);
      border-radius: var(--radius-xl);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.055),
          rgba(255, 255, 255, 0.018)
        ),
        var(--surface);

      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);

      box-shadow: var(--shadow);

      text-align: center;

      transform: perspective(1300px) rotateX(0deg);
    }

    body.light .hero {
      background: #ffffff;
      border-color: var(--border);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: var(--hero-glow-1);
      filter: blur(70px);
      top: -190px;
      right: -100px;
      pointer-events: none;
    }

    .hero-badge {
      position: relative;
      z-index: 1;

      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 8px 13px;

      border: 1px solid var(--border-strong);
      border-radius: 999px;

      background: var(--input-bg);

      color: var(--primary);

      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .hero-badge span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 5px rgba(79, 224, 176, 0.10);
    }

    .hero h1 {
      position: relative;
      z-index: 1;

      margin-top: 19px;

      font-size: clamp(34px, 5vw, 64px);
      line-height: 1.02;
      letter-spacing: -2.5px;
      font-weight: 950;

      background:
        linear-gradient(
          135deg,
          var(--text),
          var(--primary),
          var(--primary-2)
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      position: relative;
      z-index: 1;

      max-width: 720px;
      margin: 17px auto 0;

      color: var(--muted);

      font-size: 15px;
      line-height: 1.7;
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .search-wrap {
      position: relative;
      z-index: 2;

      max-width: 760px;
      margin: 30px auto 0;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;

      min-height: 60px;

      padding: 0 18px;

      border: 1px solid var(--border-strong);
      border-radius: 18px;

      background: var(--input-bg);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 15px 35px rgba(0, 0, 0, 0.10);

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    body.light .search-box {
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(32, 61, 97, 0.12);
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow:
        0 0 0 4px color-mix(
          in srgb,
          var(--primary) 14%,
          transparent
        ),
        0 15px 35px rgba(0, 0, 0, 0.10);
    }

    .search-icon {
      font-size: 22px;
      opacity: 0.8;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;

      background: transparent;

      color: var(--text);

      font-size: 15px;
      font-weight: 600;
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    /* =========================================================
       STATS
       ========================================================= */

    .stats {
      position: relative;
      z-index: 2;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;

      max-width: 760px;
      margin: 18px auto 0;
    }

    .stat {
      padding: 15px;

      border: 1px solid var(--border);
      border-radius: 15px;

      background: var(--input-bg);
    }

    .stat-number {
      font-size: 22px;
      font-weight: 900;
      color: var(--text);
    }

    .stat-label {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    /* =========================================================
       CATEGORY TABS
       ========================================================= */

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;

      margin: 42px 0 17px;
    }

    .section-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.7px;
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;

      margin-bottom: 24px;
    }

    .category-btn {
      border: 1px solid var(--border);
      border-radius: 999px;

      padding: 10px 14px;

      background: var(--surface);
      color: var(--muted);

      font-size: 12px;
      font-weight: 800;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .category-btn:hover {
      transform: translateY(-2px);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .category-btn.active {
      color: #fff;
      border-color: transparent;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      box-shadow:
        0 8px 25px rgba(75, 100, 255, 0.22);
    }

    body.light .category-btn {
      background: #ffffff;
      color: #40546f;
      border-color: #b9c8da;
    }

    body.light .category-btn.active {
      color: #ffffff;
      background:
        linear-gradient(
          135deg,
          #005fc7,
          #5635b9
        );
      border-color: transparent;
    }

    /* =========================================================
       SERVICE GRID
       ========================================================= */

    .service-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 17px;
    }

    .service-card {
      position: relative;

      min-height: 240px;

      display: flex;
      flex-direction: column;

      padding: 20px;

      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      background: var(--surface);

      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);

      box-shadow: var(--shadow-soft);

      overflow: hidden;

      transform:
        perspective(1000px)
        rotateX(0deg)
        translateY(0);

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .service-card::before {
      content: "";
      position: absolute;

      width: 150px;
      height: 150px;

      right: -75px;
      top: -75px;

      border-radius: 50%;

      background: var(--hero-glow-1);

      filter: blur(25px);

      transition: transform 0.3s ease;
    }

    .service-card:hover {
      transform:
        perspective(1000px)
        rotateX(2deg)
        translateY(-7px);

      border-color: color-mix(
        in srgb,
        var(--primary) 45%,
        var(--border)
      );

      box-shadow:
        0 25px 55px rgba(0, 0, 0, 0.18);
    }

    .service-card:hover::before {
      transform: scale(1.35);
    }

    body.light .service-card {
      background: #ffffff;
      border-color: #c9d5e5;
    }

    body.light .service-card:hover {
      box-shadow:
        0 20px 45px rgba(32, 61, 97, 0.16);
    }

    .card-top {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .service-icon {
      width: 48px;
      height: 48px;

      display: grid;
      place-items: center;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          color-mix(in srgb, var(--primary) 22%, transparent),
          color-mix(in srgb, var(--primary-2) 20%, transparent)
        );

      border: 1px solid
        color-mix(
          in srgb,
          var(--primary) 30%,
          transparent
        );

      font-size: 23px;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
    }

    .service-category {
      padding: 6px 8px;

      border-radius: 999px;

      background: var(--input-bg);
      border: 1px solid var(--border);

      color: var(--muted);

      font-size: 9px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.5px;

      text-align: center;
    }

    .service-card h3 {
      position: relative;
      z-index: 1;

      margin-top: 17px;

      color: var(--text);

      font-size: 17px;
      line-height: 1.25;
      font-weight: 900;
    }

    .service-card p {
      position: relative;
      z-index: 1;

      margin-top: 8px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.6;

      flex: 1;
    }

    .card-footer {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      margin-top: 18px;
    }

    .official-label {
      color: var(--success);

      font-size: 10px;
      font-weight: 850;

      display: flex;
      align-items: center;
      gap: 5px;
    }

    .official-label::before {
      content: "";
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--success);
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      min-height: 38px;

      padding: 0 13px;

      border-radius: 11px;

      color: #fff;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      font-size: 11px;
      font-weight: 850;

      box-shadow:
        0 7px 20px rgba(70, 90, 255, 0.20);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .open-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 10px 25px rgba(70, 90, 255, 0.30);
    }

    /* =========================================================
       NO RESULTS
       ========================================================= */

    .empty-state {
      display: none;

      padding: 55px 20px;

      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);

      background: var(--surface);

      text-align: center;
    }

    .empty-state.show {
      display: block;
    }

    .empty-icon {
      font-size: 42px;
    }

    .empty-state h3 {
      margin-top: 10px;
      font-size: 19px;
    }

    .empty-state p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      margin-top: 55px;

      padding: 25px 10px;

      border-top: 1px solid var(--border);

      text-align: center;
    }

    footer strong {
      font-size: 14px;
    }

    footer p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }
